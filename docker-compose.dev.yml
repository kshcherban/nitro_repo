services:
  nitro:
    volumes:
      - ${NITRO_BINARY_PATH:-./target/debug/nitro_repo}:/app/nitro_repo:ro
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=nitro
      - NITRO_TRACING_ENABLED=true
    ports:
      - "127.0.0.1:8000:6742"
    links:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    network_mode: "bridge"
    ports:
      - "127.0.0.1:16686:16686"  # Jaeger UI
      - "127.0.0.1:4317:4317"    # OTLP gRPC receiver
      - "127.0.0.1:4318:4318"    # OTLP HTTP receiver
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.jaeger.loadbalancer.server.port=16686"
      - "traefik.http.routers.jaeger.rule=Host(`jaeger.sudoers.dev`)"
      - "traefik.http.routers.jaeger.entrypoints=https"
      - "traefik.http.routers.jaeger.tls.certresolver=letsencrypt"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
