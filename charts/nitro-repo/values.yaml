# Default values for nitro-repo-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Nitro Repo deployment settings
replicaCount: 1

# Nitro Repo container image
image:
  repository: ghcr.io/sudoers/nitro-repo
  pullPolicy: IfNotPresent
  tag: "latest"

# Image pull secrets for private registries
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Service account configuration
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Pod annotations and labels
podAnnotations: {}
podLabels: {}

# Security contexts
podSecurityContext:
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

# Service configuration
service:
  type: ClusterIP
  port: 6742

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  hosts:
    - host: nitro.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Persistent storage configuration
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi

# Resource limits and requests
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Health check probes
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Logging configuration
rustLog: "info"

# Distributed tracing configuration
tracing:
  enabled: false
  serviceName: "nitro-repo"

# Custom environment variables (supports secret references)
env: []
  # Example usage:
  # - name: CUSTOM_SETTING
  #   value: "some-value"
  # - name: PASSWORD
  #   valueFrom:
  #     secretKeyRef:
  #       name: mysecret
  #       key: password
  #       optional: false

# PostgreSQL dependency configuration
postgresql:
  enabled: true
  auth:
    username: nitro
    password: "nitro"  # Only used when creating the database, not stored in config files
    database: nitro_repo
    existingSecret: ""
  primary:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

# External database configuration (when postgresql.enabled = false)
externalDatabase:
  url: "postgresql://user:password@host:5432/database"  # Fallback when secretRef is disabled
  secretRef:
    enabled: false
    name: "database-secret"
    key: "url"
    optional: false

# Jaeger dependency configuration
jaeger:
  enabled: false
  provisionDataStore:
    cassandra: false
    elasticsearch: false
    kafka: false
  allInOne:
    enabled: true
    image:
      repository: jaegertracing/all-in-one
      tag: latest
    options:
      log-level: info
  storage:
    type: badger


# Node selection
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
