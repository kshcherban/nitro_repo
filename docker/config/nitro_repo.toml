mode = "Release"
suggested_local_storage_path = "/data/storages"

[database]
user = "nitro"
password = "nitro"
database = "nitro_repo"
host = "172.17.0.1"
port = 5432

[sessions]
lifespan = 86400
cleanup_interval = 3600
database_location = "/data/sessions.redb"

[site]
app_url = "https://tv.sudoers.dev"


[security]
allow_basic_without_tokens = false

  [security.sso]
  enabled = true
  login_path = "/api/user/sso/login"
  login_button_text = "Sign in with Cloudflare"
  provider_login_url = "https://tv.sudoers.dev/cdn-cgi/access/login"
  provider_redirect_param = "redirect_url"
  username_header = "CF-Access-Authenticated-User-Email"
  email_header = "CF-Access-Authenticated-User-Email"
  display_name_header = "CF-Access-Authenticated-User-Name"
  auto_create_users = true


[log.levels]
default = "Info"

[log.loggers.file]
type = "RollingFile"

  [log.loggers.file.config]
  path = "/logs"
  file_prefix = "nitro_repo"
  interval = "Never"          # or "Hourly", "Minutely", "Never"

    [log.loggers.file.config.levels]
    default = "Info"
