services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    network_mode: "bridge"
    environment:
      POSTGRES_DB: nitro_repo
      POSTGRES_USER: nitro
      POSTGRES_PASSWORD: nitro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "172.17.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nitro -d nitro_repo"]
      interval: 5s
      timeout: 5s
      retries: 10

  nitro_repo:
    build: .
    restart: unless-stopped
    network_mode: "bridge"
    depends_on:
      postgres:
        condition: service_healthy
    links:
      - postgres
    ports:
      - "6742:6742"
    command: ["start", "--config", "/data/nitro_repo.toml"]
    environment:
      RUST_LOG: info
    labels:
      - "traefik.frontend.rule=Host:tv.sudoers.dev"
      - "traefik.enable=true"
      - "traefik.port=6742"
    volumes:
      - nitro_repo_data:/data
      - nitro_repo_logs:/logs
      - ./docker/config/nitro_repo.toml:/data/nitro_repo.toml:ro

volumes:
  nitro_repo_data:
  nitro_repo_logs:
  postgres_data:

networks:
  default:
    external: true
    name: bridge
