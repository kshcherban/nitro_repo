services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    network_mode: "bridge"
    environment:
      POSTGRES_DB: nitro_repo
      POSTGRES_USER: nitro
      POSTGRES_PASSWORD: nitro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nitro -d nitro_repo"]
      interval: 5s
      timeout: 5s
      retries: 10

  nitro:
    build: .
    restart: unless-stopped
    network_mode: "bridge"
    depends_on:
      postgres:
        condition: service_healthy
    links:
      - postgres
    command: ["start", "--config", "/data/config.toml"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.nitro.loadbalancer.server.port=6742"
      - "traefik.http.routers.nitro.rule=Host(`nitro.sudoers.dev`)"
      - "traefik.http.routers.nitro.entrypoints=https"
      - "traefik.http.routers.nitro.tls.certresolver=letsencrypt"
    volumes:
      - nitro_data:/data
      - ./docker/config.toml:/data/config.toml:ro

volumes:
  nitro_data:
  postgres_data:

networks:
  default:
    external: true
    name: bridge
